name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The app ships for all three, so the checks run on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint -w @writingapp/desktop
      # End-to-end checks of the built app. Linux has no display, so it gets a virtual one.
      - run: npm run build -w @writingapp/desktop
      - run: xvfb-run -a npm run e2e -w @writingapp/desktop
        if: runner.os == 'Linux'
      - run: npm run e2e -w @writingapp/desktop
        if: runner.os != 'Linux'
