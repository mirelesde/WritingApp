name: Release

# Push a tag like v0.1.0 to build installers for Mac, Windows and Linux and
# attach them to a draft GitHub release.
#
# Signing is optional and switches on by itself when its secrets exist:
#   Mac:      CSC_LINK, CSC_KEY_PASSWORD (Developer ID certificate, base64 .p12)
#             and, to notarize, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows:  WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD (code-signing certificate)
# Without them the installers are built unsigned.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Use the tag as the app version
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version -w @writingapp/desktop
      - name: Build installers
        shell: bash
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=""
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "$APPLE_ID" ]; then
            extra="-c.mac.notarize=true"
          fi
          npm run ${{ matrix.script }} -- --publish never $extra
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/*
